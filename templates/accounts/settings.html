{% extends "dashboard/base.html" %}{% block title %}Settings | CreatorHub{% endblock %}{% block dashboard_content %}<div class="page-heading"><div><h1>Settings</h1><p>Your account and creator workspace details.</p></div></div><section class="panel" style="max-width:650px"><div class="panel-heading"><h2>Account</h2><span>Email confirmed</span></div><form method="post">{% csrf_token %}<div class="field"><label for="display_name">Creator / workspace name</label><input id="display_name" name="display_name" value="{{ user.first_name }}" minlength="2" maxlength="80" required></div><div class="field"><label>Email address</label><input value="{{ user.email }}" readonly></div><div class="form-actions"><button class="button button-dark" type="submit">Save profile</button></div></form><p style="font-size:10px;color:#879087;line-height:1.6">Change your password from the <a href="{% url 'accounts:password_reset' %}">password reset page</a>.</p></section>{% endblock %}
